name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une PR mise à jour annule le run précédent : on ne paie pas deux fois la même vérification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installe exactement le package-lock.json, sans le modifier.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires et couverture
        run: npm run test:coverage

      - name: Build de production
        run: npm run build

      # Cloudflare Pages : le repli SPA (index.html pour toute URL qui n'est pas un fichier) ne
      # marche que sans 404.html ; pas de _redirects (une règle /* serait vue comme une boucle) ;
      # _headers et robots.txt doivent être copiés dans le build (docs/DEPLOIEMENT.md).
      - name: Fichiers d'hébergement dans dist/
        run: |
          test ! -e dist/404.html || { echo "::error::dist/404.html casserait le repli SPA de Cloudflare Pages"; exit 1; }
          test ! -e dist/_redirects || { echo "::error::dist/_redirects ne doit pas exister"; exit 1; }
          test -f dist/_headers || { echo "::error::dist/_headers manquant"; exit 1; }
          test -f dist/robots.txt || { echo "::error::dist/robots.txt manquant"; exit 1; }
          echo "dist/ prêt pour Cloudflare Pages : _headers et robots.txt présents, ni 404.html ni _redirects."

  base-de-donnees:
    name: Tests SQL (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installe la CLI Supabase à la version figée dans package-lock.json (devDependency).
      - run: npm ci

      # Postgres seul (Docker est fourni par le runner) : la CLI y applique aussi les schémas
      # auth et storage (auth.users, storage.objects) utilisés par les tests, puis nos
      # migrations et seed.sql. Vérifié : identique à un `supabase start` complet pour nos
      # tests, en bien plus rapide.
      - name: Démarrer la base locale
        run: npx supabase db start

      - name: Tests pgTAP
        run: npx supabase test db

  e2e:
    name: Tests end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les navigateurs ne sont pas dans node_modules : il faut les télécharger. Chromium sert aux
      # projets Android et desktop, WebKit au projet iPhone. Les binaires sont mis en cache
      # (clé = version de Playwright, chaque version attend ses propres navigateurs, ET version
      # d'Ubuntu : WebKit est compilé pour une version précise ; sans elle, au passage de
      # `ubuntu-latest` à une nouvelle version, le WebKit en cache ne démarrait plus, faute de
      # `libicudata.so.74`). Les bibliothèques système (apt) ne se cachent pas et sont
      # réinstallées à chaque run.
      - name: Version de Playwright et d'Ubuntu
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs Playwright
        id: cache-navigateurs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Installer Chromium et WebKit
        if: steps.cache-navigateurs.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Installer les dépendances système des navigateurs
        if: steps.cache-navigateurs.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Tests Playwright
        run: npm run test:e2e

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
